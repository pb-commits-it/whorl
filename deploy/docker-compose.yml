# Postgres 16 + pgvector for whorl.
#
# Local dev:   docker compose -f deploy/docker-compose.yml up -d
# Production:  same compose, run on the IONOS VM, behind a private bind.
#
# Data lives at /var/lib/whorl/pg in production. For local dev we use a named
# volume so it survives container restarts but doesn't pollute the repo dir.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: whorl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: whorl
      POSTGRES_PASSWORD: whorl
      POSTGRES_DB: whorl
    ports:
      - "127.0.0.1:5433:5432"   # bind only to localhost; 5433 to avoid colliding with system pg
    volumes:
      - whorl-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whorl -d whorl"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  whorl-pg:
