[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "whorl"
version = "0.2.0"
description = "Open-source crop-scouting dashboard for Midwest farmers and agronomists. Photo of a pest in, cited recommendation out."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Paul Bergeron" }]
keywords = ["agriculture", "ipm", "pest-management", "entomology", "agronomy", "scouting", "agtech"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sse-starlette>=2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "itsdangerous>=2.2",
    "python-jose[cryptography]>=3.3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
    "aiosqlite>=0.20",
]

[project.scripts]
whorl = "whorl.cli:main"

[project.urls]
Homepage = "https://github.com/pb-commits-it/whorl"
Repository = "https://github.com/pb-commits-it/whorl"

[tool.hatch.build.targets.wheel]
packages = ["whorl"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
